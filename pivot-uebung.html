<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototyp: Pivot-Tabelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --excel-green: #107C41;
    --excel-green-dark: #0B5C30;
    --excel-green-tint: #E9F6EE;
    --excel-blue-tint: #DDEBF7; /* helles Blau, wie Excels Standard-PivotTable-Formatvorlage für Kopf-/Summenzeilen */
    --grid-gray: #D7DCE1;
    --header-gray: #F2F4F6;
    --error-red: #D92D20;
    --error-red-tint: #FBEAE9;
    --success-green: #15803D;
    --success-green-tint: #EAF7EF;

    --text-primary: #1F2A24;
    --text-muted: #5B6B63;
    --border-color: #E1E5E2;
    --surface: #FFFFFF;
    --page-bg: #F7F9F8;

    --font-heading: "Space Grotesk", sans-serif;
    --font-body: "Inter", sans-serif;
    --font-mono: "JetBrains Mono", monospace;

    --radius: 10px;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    background: var(--page-bg);
    color: var(--text-primary);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4 { font-family: var(--font-heading); margin: 0; color: var(--text-primary); }

  header.site-header {
    background: linear-gradient(135deg, var(--excel-green) 0%, var(--excel-green-dark) 100%);
    color: #fff;
    padding: 0.6rem 1.5rem;
  }

  .site-header__inner { max-width: 1180px; margin: 0 auto; display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; }
  .site-header__inner h1 { font-size: 1.1rem; font-weight: 600; }
  .site-header__badge {
    font-size: 0.75rem;
    background: rgba(255,255,255,0.16);
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
  }

  main { max-width: 1180px; margin: 0 auto; padding: 0.7rem 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 1.1rem 1.3rem;
    box-shadow: 0 1px 2px rgba(16,124,65,0.06), 0 4px 14px rgba(16,124,65,0.06);
  }

  /* Kompakter als eine normale .card: die Aufgabenbeschreibung soll möglichst
     wenig vertikalen Platz beanspruchen, damit mehr Raum für das Arbeitsblatt bleibt. */
  .task-card {
    padding: 0.45rem 0.85rem;
  }

  .task-card h2 { font-size: 0.9rem; margin-bottom: 0.1rem; }
  .task-card p { margin: 0.08rem 0; color: var(--text-primary); font-size: 0.76rem; line-height: 1.25; }
  .task-card .goal { color: var(--text-muted); font-size: 0.72rem; }

  .hints-toggle {
    margin-top: 0.2rem;
    background: none;
    border: none;
    color: var(--excel-green-dark);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.74rem;
    cursor: pointer;
    padding: 0;
  }

  .hints-box {
    display: none;
    margin-top: 0.3rem;
    background: var(--excel-green-tint);
    border: 1px solid var(--excel-green);
    border-radius: 8px;
    padding: 0.45rem 0.65rem;
    font-size: 0.74rem;
  }
  .hints-box.open { display: block; }
  .hints-box ul { margin: 0.25rem 0 0; padding-left: 1.1rem; }

  /* ---------- Excel-Fenster: EIN Tabellenblatt (Quelldaten + Pivot-Ausgabe
     nebeneinander im selben Raster) plus rechts angedockte PivotTable-Feldliste ---------- */
  .excel-window { padding: 0; overflow: hidden; }

  .excel-body {
    display: flex;
    align-items: stretch;
  }

  @media (max-width: 860px) {
    .excel-body { flex-direction: column; }
  }

  .sheet-caption {
    margin: 0;
    padding: 0.5rem 0.9rem;
    font-size: 0.76rem;
    color: var(--text-muted);
    border-top: 1px solid var(--border-color);
  }

  /* ---------- Arbeitsblatt-Look: Spaltenbuchstaben, Zeilennummern, volle
     Gitternetzlinien, scharfe Ecken ---------- */
  .excel-body .sheet-wrap {
    position: relative; /* Positionierungskontext für das Leer-PivotTable-Overlay */
    flex: 1;
    min-width: 0;
    max-height: 600px;
    overflow: auto;
    border: none;
    border-radius: 0;
  }

  /* Leerer-Bericht-Hinweis, wie ihn eine neu angelegte PivotTable in echtem Excel
     zeigt: schwebt über dem (weiterhin leeren, gitterlinierten) Zellbereich, statt
     ihn durch eine eigene Box zu ersetzen. Position wird per JS auf die tatsächlich
     gerenderte Ankerzelle ausgerichtet (Spaltenbreiten sind inhaltsabhängig). */
  .pivot-empty-overlay {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.7rem;
    width: 300px;
    padding: 0.9rem 0.6rem 0.5rem;
    pointer-events: none;
  }

  .pivot-empty-overlay__namebox {
    border: 1px solid var(--grid-gray);
    background: #fff;
    color: var(--text-muted);
    font-family: var(--font-body);
    font-size: 0.82rem;
    padding: 0.2rem 1.4rem;
    border-radius: 2px;
  }

  .pivot-empty-overlay__text {
    margin: 0;
    text-align: center;
    font-family: var(--font-body);
    font-weight: 700;
    color: #1F1F1F;
    font-size: 0.84rem;
    line-height: 1.4;
    max-width: 250px;
  }

  .pivot-empty-overlay__art svg {
    width: 190px;
    height: auto;
    display: block;
  }

  table.sheet-table {
    border-collapse: collapse;
    /* Kein width:100% — sonst zwingt das die Spalten, sich auf die volle
       Breite des Arbeitsblatts aufzublähen, statt sich an ihrem Inhalt zu
       orientieren (besonders sichtbar, wenn die Pivot-Spalten noch leer
       sind: dann fließt der komplette überschüssige Platz in A–C). */
    width: auto;
    font-size: 0.82rem;
    font-family: var(--font-mono);
  }

  table.sheet-table th, table.sheet-table td {
    border: 1px solid var(--grid-gray); /* Rahmen auf allen vier Seiten statt nur horizontal */
    padding: 0.26rem 0.4rem;
    white-space: nowrap;
    background: #fff; /* einheitlicher Zellhintergrund, keine Zebra-Streifen */
    /* Einheitliche Standardbreite für jede Spalte, ob mit oder ohne Inhalt —
       sonst fallen leere (Lücken-/Pivot-Platzhalter-)Spalten neben A–C winzig
       aus. Zeilennummern-/Eckzelle bewusst ausgenommen, siehe unten. */
    min-width: 92px;
  }

  table.sheet-table th { text-align: center; }
  table.sheet-table td { text-align: right; }
  table.sheet-table .rowlabel { text-align: left; font-weight: 500; }

  table.sheet-table .sheet-rownum, table.sheet-table .sheet-corner {
    min-width: 0;
    width: 1%;
  }

  /* Nur im leeren Zustand (kein Feld abgelegt): min-width allein reicht nicht,
     weil die Tabelle mit width:auto trotzdem versucht, den ganzen verfügbaren
     Platz zu füllen — ohne Inhalt in den Pivot-Spalten fließt dieser Zuwachs
     ungleichmäßig in irgendeine Spalte statt gleichmäßig auf neue Spalten
     verteilt zu werden. Deshalb hier jede Spalte hart auf eine feste Breite
     fixieren (min = max = width); die normale Pivot-Darstellung mit echtem
     Inhalt bleibt davon unberührt (dort bestimmt weiterhin der Inhalt die
     Breite, siehe oben). */
  table.sheet-table.sheet-table--uniform-cols th,
  table.sheet-table.sheet-table--uniform-cols td {
    width: 96px;
    min-width: 96px;
    max-width: 96px;
  }
  table.sheet-table.sheet-table--uniform-cols .sheet-rownum,
  table.sheet-table.sheet-table--uniform-cols .sheet-corner {
    width: 32px;
    min-width: 0;
    max-width: 32px;
  }

  /* Spaltenbuchstaben-Kopfzeile: helle, gedämpfte, zentrierte Chrome-Zeile */
  table.sheet-table .sheet-colheads th {
    position: sticky;
    top: 0;
    background: var(--header-gray);
    color: var(--text-muted);
    font-family: var(--font-body);
    font-size: 0.72rem;
    font-weight: 600;
    z-index: 2;
  }

  table.sheet-table .sheet-corner {
    position: sticky;
    left: 0;
    z-index: 3;
    background: var(--header-gray);
  }

  /* Zeilennummern-Spalte: gleiche gedämpfte Chrome-Optik */
  table.sheet-table .sheet-rownum {
    position: sticky;
    left: 0;
    background: var(--header-gray);
    color: var(--text-muted);
    font-family: var(--font-body);
    font-size: 0.72rem;
    font-weight: 600;
    z-index: 2;
  }

  /* Inhaltliche Kopfzeile(n) der jeweiligen Tabelle (Feldnamen bzw. Pivot-Header) */
  table.sheet-table .sheet-header-row th,
  table.sheet-table .sheet-header-row td {
    position: sticky;
    background: var(--header-gray);
    font-family: var(--font-body);
    font-weight: 600;
    z-index: 1;
  }
  table.sheet-table .sheet-header-row .sheet-rownum { z-index: 3; }

  table.sheet-table .cell-total {
    font-weight: 700;
    background: var(--excel-blue-tint);
  }

  /* Kopfzeile(n) der Pivot-Ausgabe selbst (Zeilen-/Spaltenbeschriftung,
     "Agg von Feld") — pro Zelle statt pro Zeile markiert, da die Zeile über
     den Merge auch die Quelldaten-Spalten A–D enthält, die ihr neutrales
     Grau behalten sollen, nicht das Blau der Pivot-Kopfzeile. */
  table.sheet-table th.pivot-header-row,
  table.sheet-table td.pivot-header-row {
    background: var(--excel-blue-tint);
  }

  /* ---------- Rechts angedockte PivotTable-Feldliste (echtes Excel-Panel-Vorbild) ---------- */
  .pivot-fields-panel {
    width: 280px;
    flex-shrink: 0;
    background: #fff; /* wie das Arbeitsblatt links — nur die Trennlinie grenzt ab, keine Flächenfarbe */
    border-left: 1px solid var(--grid-gray);
    padding: 0.5rem 0.7rem 0.6rem;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    /* Gleiche Höhe wie das Arbeitsblatt daneben — großzügig genug, damit alle
       vier Bereiche (Filter/Spalten/Zeilen/Werte) auch mit befüllten Zonen auf
       einen Blick sichtbar sind, ohne dafür scrollen zu müssen. */
    max-height: 600px;
    overflow-y: auto;
  }

  .pivot-fields-panel__title {
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--text-primary);
    padding-bottom: 0.22rem;
    border-bottom: 1px solid var(--grid-gray);
  }

  .pivot-fields-panel__list {
    display: flex;
    flex-direction: column;
    gap: 0.05rem;
  }

  .field-row {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.12rem 0.35rem;
    border-radius: 4px;
    font-size: 0.8rem;
    cursor: grab;
    user-select: none;
  }
  .field-row > span:last-child { min-width: 0; overflow-wrap: break-word; }
  .field-row:active { cursor: grabbing; }
  .field-row:hover { background: rgba(16, 124, 65, 0.08); }
  .field-row.selected { background: var(--excel-green-tint); outline: 1px solid var(--excel-green); }
  .field-row .field-icon { font-size: 0.85rem; }

  /* Einspaltig statt 2x2 gestapelt: jede Zone bekommt die volle Panel-Breite,
     damit Select/Feldname/Entfernen-Button nie um Platz konkurrieren müssen —
     robust auch bei längeren Feldnamen als in den aktuellen drei Feldern. */
  .pivot-fields-panel__areas {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    border-top: 1px solid var(--grid-gray);
    padding-top: 0.35rem;
  }

  .area-box__label {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    font-weight: 700;
    display: block;
    margin-bottom: 0.12rem;
  }

  .area-box__drop {
    min-height: 18px;
    padding: 0.14rem;
    background: var(--header-gray); /* helle, sichtbar abgesetzte Füllung als Ablagefläche */
  }

  .pivot-fields-panel .zone-chip {
    padding: 0.16rem 0.35rem;
    font-size: 0.76rem;
    max-width: 100%;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    background: var(--excel-green-tint);
    border: 1px solid var(--excel-green);
    color: var(--excel-green-dark);
    border-radius: 7px;
    padding: 0.32rem 0.55rem;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: grab;
    user-select: none;
  }

  .chip:active { cursor: grabbing; }

  .chip.dragging { opacity: 0.4; }

  .chip.selected {
    outline: 2px solid var(--excel-green-dark);
    outline-offset: 1px;
  }

  .chip .field-icon { font-size: 0.9rem; }

  .zone-chip {
    background: #fff;
    border: 1px solid var(--excel-green);
    max-width: 100%;
    flex-wrap: wrap;
  }

  .zone-chip .chip-text {
    white-space: normal;
    word-break: break-word;
    min-width: 0;
  }

  .zone-chip button.chip-remove {
    border: none;
    background: none;
    color: var(--error-red);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    padding: 0 0.1rem;
    font-weight: 700;
  }

  /* Zweizeiliger Chip-Aufbau (Kopfzeile + eigene Zeile darunter für Datums-Stufen
     oder das Aggregations-Dropdown) — verhindert, dass ein select/Steuerelement
     neben einem Feldnamen um Platz konkurriert und seitlich abgeschnitten wird. */
  .zone-chip--multiline {
    display: flex; /* statt inline-flex: nimmt die volle Breite der Zone ein,
      damit width:100% beim Aggregations-Dropdown eindeutig berechnet werden kann */
    flex-direction: column;
    align-items: stretch;
    gap: 0.25rem;
  }

  .zone-chip__head {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    flex-wrap: wrap;
    min-width: 0;
  }

  .zone-chip--multiline .agg-select {
    width: 100%;
  }

  .dategroup-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
  }

  .dategroup-pills .pill {
    font-family: var(--font-body);
    font-size: 0.72rem;
    font-weight: 500;
    background: #fff;
    color: var(--text-muted);
    border: 1px solid var(--grid-gray);
    border-radius: 999px;
    padding: 0.15rem 0.55rem;
    cursor: pointer;
  }

  .dategroup-pills .pill.active {
    background: var(--excel-green);
    border-color: var(--excel-green);
    color: #fff;
  }

  .zone-chip .agg-select {
    font-family: var(--font-body);
    font-size: 0.72rem;
    color: var(--text-primary);
    background: var(--header-gray);
    border: 1px solid var(--grid-gray);
    border-radius: 5px;
    padding: 0.1rem 0.3rem;
    cursor: pointer;
  }

  .dropzone {
    border: 1.5px dashed var(--grid-gray);
    border-radius: 8px;
    background: var(--header-gray);
    padding: 0.55rem 0.65rem;
    min-height: 74px;
    transition: background 0.15s, border-color 0.15s;
  }

  .dropzone .zone-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 0.4rem;
    display: block;
  }

  .dropzone .zone-chips {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .dropzone .zone-placeholder {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-style: italic;
  }

  .dropzone.dragover {
    background: var(--excel-green-tint);
    border-color: var(--excel-green);
  }

  .dropzone.selectable {
    cursor: pointer;
  }

  /* ---------- Formelleiste + aktive Zelle (nur Pivot-Vorschau) ---------- */
  .formula-bar {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    border-bottom: 1px solid var(--grid-gray);
    background: #fff;
    padding: 0.35rem 0.6rem;
    font-family: var(--font-mono);
    font-size: 0.82rem;
  }

  .formula-namebox {
    min-width: 3.2rem;
    padding: 0.1rem 0.5rem 0.1rem 0;
    margin-right: 0.2rem;
    border-right: 1px solid var(--grid-gray);
    color: var(--text-primary);
    font-weight: 600;
  }

  .formula-fx {
    color: var(--excel-green-dark);
    font-style: italic;
    font-weight: 700;
    font-size: 0.9rem;
  }

  .formula-text {
    color: var(--text-primary);
    white-space: nowrap;
    overflow-x: auto;
  }

  .sheet-cell--value { cursor: pointer; }

  .sheet-cell--active {
    outline: 2px solid var(--excel-green);
    outline-offset: -2px;
    position: relative;
  }

  .sheet-cell--active::after {
    content: "";
    position: absolute;
    right: -1px;
    bottom: -1px;
    width: 6px;
    height: 6px;
    background: var(--excel-green);
  }

  table.sheet-table .pivot-placeholder {
    text-align: left;
    font-style: italic;
    color: var(--text-muted);
    background: #fff;
    white-space: normal;
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    flex-wrap: wrap;
  }

  button.btn {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.9rem;
    border-radius: 8px;
    padding: 0.55rem 1.1rem;
    cursor: pointer;
    border: 1px solid var(--excel-green);
  }

  button.btn-primary {
    background: var(--excel-green);
    color: #fff;
    border-color: var(--excel-green);
  }
  button.btn-primary:hover { background: var(--excel-green-dark); }

  button.btn-secondary {
    background: #fff;
    color: var(--excel-green-dark);
  }
  button.btn-secondary:hover { background: var(--excel-green-tint); }

  #feedback {
    font-size: 0.9rem;
    font-weight: 500;
    padding: 0.7rem 0.9rem;
    border-radius: 8px;
    display: none;
  }
  #feedback.show { display: block; }
  #feedback.correct { background: var(--success-green-tint); color: var(--success-green); border: 1px solid var(--success-green); }
  #feedback.incorrect { background: var(--error-red-tint); color: var(--error-red); border: 1px solid var(--error-red); }
  #feedback ul { margin: 0.2rem 0 0; padding-left: 1.1rem; }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <h1>Excel<span style="opacity:.75">.</span>Flo — Pivot-Tabelle</h1>
    <span class="site-header__badge">Prototyp, noch nicht im Übungsportal</span>
  </div>
</header>

<main>
  <section class="card task-card">
    <h2 id="task-title"></h2>
    <div id="task-intro"></div>
    <button class="hints-toggle" id="hints-toggle">Tipps anzeigen</button>
    <div class="hints-box" id="hints-box">
      <ul id="hints-list"></ul>
    </div>
  </section>

  <section class="card excel-window">
    <div class="formula-bar">
      <span class="formula-namebox" id="formula-namebox"></span>
      <span class="formula-fx" aria-hidden="true">𝑓x</span>
      <span class="formula-text" id="formula-text"></span>
    </div>
    <div class="excel-body">
      <div class="sheet-wrap" id="sheet-canvas"></div>
      <aside class="pivot-fields-panel">
        <h4 class="pivot-fields-panel__title">PivotTable-Felder</h4>
        <div class="pivot-fields-panel__list" id="field-list"></div>
        <div class="pivot-fields-panel__areas">
          <div class="area-box" data-zone="filter">
            <span class="area-box__label">Filter</span>
            <div class="area-box__drop dropzone selectable" id="zone-filter"><span class="zone-placeholder">Felder hierher ziehen</span></div>
          </div>
          <div class="area-box" data-zone="columns">
            <span class="area-box__label">Spalten</span>
            <div class="area-box__drop dropzone selectable" id="zone-columns"><span class="zone-placeholder">Felder hierher ziehen</span></div>
          </div>
          <div class="area-box" data-zone="rows">
            <span class="area-box__label">Zeilen</span>
            <div class="area-box__drop dropzone selectable" id="zone-rows"><span class="zone-placeholder">Felder hierher ziehen</span></div>
          </div>
          <div class="area-box" data-zone="values">
            <span class="area-box__label">Werte</span>
            <div class="area-box__drop dropzone selectable" id="zone-values"><span class="zone-placeholder">Felder hierher ziehen</span></div>
          </div>
        </div>
      </aside>
    </div>
    <p class="sheet-caption" id="sheet-caption"></p>
  </section>

  <div class="actions">
    <button class="btn btn-primary" id="btn-check">Prüfen</button>
    <button class="btn btn-secondary" id="btn-reset">Zurücksetzen</button>
  </div>
  <div id="feedback"></div>
</main>

<script>
(function () {
  "use strict";

  // ---------- Datengenerierung (seeded, damit die Demo stabil bleibt) ----------
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(20260101);

  var REGIONS = ["Nord", "Süd", "Ost", "West"];
  var REGION_BASE = { Nord: 900, "Süd": 1100, Ost: 700, West: 1250 };

  function serialToDate(days) {
    // 2026-01-01 + days
    var d = new Date(Date.UTC(2026, 0, 1));
    d.setUTCDate(d.getUTCDate() + days);
    return d;
  }

  function formatDate(d) {
    var dd = String(d.getUTCDate()).padStart(2, "0");
    var mm = String(d.getUTCMonth() + 1).padStart(2, "0");
    return dd + "." + mm + "." + d.getUTCFullYear();
  }

  var DATA = [];
  var dayCount = (Date.UTC(2027, 0, 1) - Date.UTC(2026, 0, 1)) / 86400000; // 365
  for (var i = 0; i < dayCount; i++) {
    var date = serialToDate(i);
    var region = REGIONS[Math.floor(rand() * REGIONS.length)];
    var base = REGION_BASE[region];
    var umsatz = Math.round(base + (rand() - 0.4) * 700);
    if (umsatz < 50) umsatz = 50;
    DATA.push({ Datum: date, Region: region, Umsatz: umsatz });
  }

  function formatCurrency(n) {
    return n.toLocaleString("de-DE", { maximumFractionDigits: 0 }) + " €";
  }
  function formatNumber(n) {
    return n.toLocaleString("de-DE", { maximumFractionDigits: 2 });
  }

  // ---------- Arbeitsblatt-Chrome (Spaltenbuchstaben, Zeilennummern, Gitter) ----------
  // Baut aus "logischen Zeilen" (Arrays von Zell-Deskriptoren {html, colspan,
  // header, cls, attrs}) eine Tabelle im Look eines rohen, unformatierten
  // Excel-Arbeitsblatts: Spaltenbuchstaben oben, Zeilennummern links,
  // durchgehende Gitternetzlinien. Zeilen mit row.sticky=true (die
  // inhaltlichen Kopfzeilen der jeweiligen Tabelle) bleiben beim Scrollen
  // zusammen mit der Buchstaben-Zeile oben fixiert. Wird sowohl für die
  // Quelldaten- als auch die Pivot-Vorschau-Tabelle verwendet.
  function columnLetter(n) {
    var s = "";
    while (n > 0) {
      var rem = (n - 1) % 26;
      s = String.fromCharCode(65 + rem) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  function renderSheetTable(rows, extraTableClass) {
    var totalCols = 0;
    rows.forEach(function (row) {
      var cols = row.reduce(function (sum, cell) { return sum + (cell.colspan || 1); }, 0);
      if (cols > totalCols) totalCols = cols;
    });

    var ROW_H = 28; // px, angenommene Zeilenhöhe zum Stapeln fixierter Kopfzeilen
    var stickyDepth = 1; // Slot 0 ist die Spaltenbuchstaben-Zeile selbst

    var html = '<table class="sheet-table' + (extraTableClass ? " " + extraTableClass : "") + '"><thead><tr class="sheet-colheads"><th class="sheet-corner" style="top:0px;left:0px"></th>';
    for (var c = 1; c <= totalCols; c++) html += "<th>" + columnLetter(c) + "</th>";
    html += "</tr></thead><tbody>";

    rows.forEach(function (row, i) {
      var topStyle = "";
      if (row.sticky) {
        topStyle = ' style="top:' + (stickyDepth * ROW_H) + 'px"';
        stickyDepth++;
      }
      var trClasses = [];
      if (row.sticky) trClasses.push("sheet-header-row");
      if (row.cls) trClasses.push(row.cls);
      html += "<tr" + (trClasses.length ? ' class="' + trClasses.join(" ") + '"' : "") + '><th class="sheet-rownum"' + topStyle + ">" + (i + 1) + "</th>";
      row.forEach(function (cell) {
        var tag = cell.header ? "th" : "td";
        var cls = cell.cls ? ' class="' + cell.cls + '"' : "";
        var colspan = cell.colspan && cell.colspan > 1 ? ' colspan="' + cell.colspan + '"' : "";
        html += "<" + tag + cls + colspan + (cell.attrs || "") + topStyle + ">" + cell.html + "</" + tag + ">";
      });
      html += "</tr>";
    });

    html += "</tbody></table>";
    return html;
  }

  // ---------- Quelldaten als Zeilen aufbereiten (Spalten A–C des gemeinsamen Blatts) ----------
  var SOURCE_COL_COUNT = 3; // Datum, Region, Umsatz
  var GAP_COLS = 1; // eine leere Spalte zwischen Quelldaten und Pivot-Ausgabe, wie in echten Excel-Blättern üblich
  var PIVOT_COL_OFFSET = SOURCE_COL_COUNT + GAP_COLS; // physische Spalten, ab denen die Pivot-Ausgabe beginnt

  var sourceRows = [];
  var sourceHeaderRow = [
    { header: true, cls: "rowlabel", html: "Datum" },
    { header: true, cls: "rowlabel", html: "Region" },
    { header: true, html: "Umsatz" }
  ];
  sourceHeaderRow.sticky = true;
  sourceRows.push(sourceHeaderRow);
  DATA.forEach(function (row) {
    sourceRows.push([
      { cls: "rowlabel", html: formatDate(row.Datum) },
      { cls: "rowlabel", html: row.Region },
      { html: formatCurrency(row.Umsatz) }
    ]);
  });

  // Fügt Quelldaten- und Pivot-Zeilen spaltenweise zu EINEM Tabellenblatt
  // zusammen (gemeinsame Zeilennummerierung, eine Lückenspalte dazwischen) —
  // genau das Bild, das der Nutzer beim Arbeiten in Excel hätte.
  function mergeIntoSheet(srcRows, pvRows, pvColCount) {
    var maxRows = Math.max(srcRows.length, pvRows.length);
    var merged = [];
    for (var i = 0; i < maxRows; i++) {
      var row = [];
      var src = srcRows[i];
      row = row.concat(src || [{ colspan: SOURCE_COL_COUNT, html: "" }]);
      for (var g = 0; g < GAP_COLS; g++) row.push({ html: "" });
      var pv = pvRows[i];
      if (pv) row = row.concat(pv);
      else if (pvColCount) row.push({ colspan: pvColCount, html: "" });
      if ((src && src.sticky) || (pv && pv.sticky)) row.sticky = true;
      if (pv && pv.cls) row.cls = pv.cls;
      else if (src && src.cls) row.cls = src.cls;
      merged.push(row);
    }
    return merged;
  }

  // ---------- Feld-Definitionen ----------
  var FIELDS = {
    Datum: { icon: "📅", type: "date" },
    Region: { icon: "🌍", type: "text" },
    Umsatz: { icon: "💰", type: "number" }
  };

  var AGGS_NUMERIC = ["Summe", "Anzahl", "Mittelwert", "Min", "Max"];
  var AGGS_OTHER = ["Anzahl"];

  // ---------- Datumsgruppierung ----------
  var DATE_LEVELS = ["jahr", "quartal", "monat", "tag"];
  var DATE_LEVEL_LABELS = { jahr: "Jahr", quartal: "Quartal", monat: "Monat", tag: "Tag" };
  var MONTH_NAMES = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
  // Bei einem vollen Jahr an Tagesdaten ist "Monat" ein sinnvollerer Default als
  // "Tag" (365 Einzeltage wären unübersichtlich) — echtes Excel schlägt beim
  // Gruppieren eines Datumsfelds ähnlich vor.
  var DEFAULT_DATE_LEVELS = ["monat"];
  // Aktuell gewählte Gruppierungsstufen je Datumsfeld (nur relevant, wenn das
  // Feld in Zeilen/Spalten liegt); fehlt ein Eintrag, gilt DEFAULT_DATE_LEVELS.
  var dateGroupLevels = {};

  function aggOptionsFor(fieldName) {
    return FIELDS[fieldName].type === "number" ? AGGS_NUMERIC : AGGS_OTHER;
  }

  function defaultAgg(fieldName) {
    return FIELDS[fieldName].type === "number" ? "Summe" : "Anzahl";
  }

  function aggregate(agg, values) {
    if (agg === "Anzahl") return values.length;
    var nums = values.map(Number);
    if (agg === "Summe") return nums.reduce(function (a, b) { return a + b; }, 0);
    if (agg === "Mittelwert") return nums.length ? nums.reduce(function (a, b) { return a + b; }, 0) / nums.length : 0;
    if (agg === "Min") return nums.length ? Math.min.apply(null, nums) : 0;
    if (agg === "Max") return nums.length ? Math.max.apply(null, nums) : 0;
    return 0;
  }

  function formatAggResult(agg, fieldName, value) {
    if (agg === "Anzahl") return formatNumber(value);
    if (FIELDS[fieldName].type === "number") return formatCurrency(Math.round(value * 100) / 100);
    return formatNumber(value);
  }

  // ---------- Übungs-Definitionen ----------
  // Jede Übung hat eine "solution": welche Felder in Zeilen/Spalten/Filter liegen
  // müssen und welches Wertefeld mit welcher Aggregation in "Werte" gehört.
  // rowsColsInterchangeable: true bedeutet, dass die Gruppierungsfelder wahlweise
  // in Zeilen ODER Spalten liegen dürfen (nur transponiert, inhaltlich gleich) —
  // die Prüfung vergleicht dafür das tatsächlich berechnete Pivot-Ergebnis statt
  // starrer Feld-Zone-Zuordnungen, siehe checkSolution() weiter unten.
  var EXERCISES = [
    {
      id: "umsatz-je-region",
      title: "Umsatz je Region auswerten",
      intro: "<p>Du hast eine Tabelle mit dem Tagesumsatz für das Jahr 2026 (Spalten: Datum, Region, Umsatz). Erstelle daraus per Drag &amp; Drop eine Pivot-Tabelle, die den <strong>Umsatz je Region</strong> zusammenfasst.</p>" +
        '<p class="goal">Ziehe die Felder aus der Feldliste unten links in die passenden Bereiche rechts (Zeilen / Spalten / Werte / Filter) — genau wie in echten Excel-PivotTables.</p>',
      hints: [
        "Das Feld, nach dem gruppiert werden soll, gehört in den Bereich <strong>Zeilen</strong> (oder alternativ <strong>Spalten</strong> — beides ergibt eine inhaltlich richtige, nur transponierte Tabelle).",
        "Das Feld, das ausgewertet werden soll, gehört in den Bereich <strong>Werte</strong>.",
        "Klicke auf das Dropdown im „Werte“-Chip, um die Aggregation (Summe / Anzahl / Mittelwert …) zu ändern.",
        "Ein Feld per Klick auf das × wieder aus einem Bereich entfernen."
      ],
      solution: {
        rows: ["Region"],
        columns: [],
        filter: [],
        values: [{ field: "Umsatz", agg: "Summe" }],
        rowsColsInterchangeable: true
      }
    },
    {
      id: "anzahl-verkaeufe-je-region",
      title: "Anzahl Verkaufstage je Region",
      intro: "<p>Für wie viele Tage liegt je Region überhaupt ein Umsatz vor? Erstelle eine Pivot-Tabelle, die das je Region auswertet.</p>" +
        '<p class="goal">Ziehe die passenden Felder in die Bereiche rechts. Achte genau darauf, was gezählt werden soll.</p>',
      hints: [
        "Das gruppierende Feld gehört wieder in den Bereich <strong>Zeilen</strong>.",
        "Excel wählt bei einem Zahlenfeld im Bereich „Werte“ standardmäßig „Summe“ — hier ist aber nicht die Summe des Umsatzes gefragt, sondern wie viele Tage (Zeilen) es je Region gibt.",
        "Über das Dropdown im „Werte“-Chip lässt sich die Aggregation von Summe auf eine andere Option umstellen."
      ],
      solution: {
        rows: ["Region"],
        columns: [],
        filter: [],
        values: [{ field: "Umsatz", agg: "Anzahl" }],
        rowsColsInterchangeable: true
      }
    },
    {
      id: "umsatz-je-quartal",
      title: "Umsatz je Quartal",
      intro: "<p>365 einzelne Tageswerte sind unübersichtlich. Fasse den Umsatz für das Jahr 2026 stattdessen <strong>je Quartal</strong> zusammen.</p>" +
        '<p class="goal">Ziehe die passenden Felder in die Bereiche rechts. Liegt ein Datumsfeld in „Zeilen“ oder „Spalten“, kannst du direkt darunter einstellen, nach welcher Zeiteinheit gruppiert wird.</p>',
      hints: [
        "Das Datumsfeld gehört in den Bereich <strong>Zeilen</strong> (oder alternativ <strong>Spalten</strong>).",
        "Sobald das Datumsfeld dort liegt, erscheinen darunter Schalter für Jahr / Quartal / Monat / Tag — mehrere gleichzeitig sind möglich, hier reicht aber <strong>nur Quartal</strong>.",
        "Im Bereich „Werte“ ist wie gewohnt „Umsatz“ mit der passenden Aggregation gefragt."
      ],
      solution: {
        rows: ["Datum"],
        columns: [],
        filter: [],
        values: [{ field: "Umsatz", agg: "Summe" }],
        rowsColsInterchangeable: true,
        dateGroupLevels: { Datum: ["quartal"] }
      }
    }
  ];

  var currentExercise = EXERCISES[0];

  // ---------- Zustand ----------
  // zones.rows / columns / filter: array of field names
  // zones.values: array of { field, agg }
  var zones = { filter: [], columns: [], rows: [], values: [] };
  var selectedField = null; // field name currently selected via click (mobile fallback)
  var selectedFieldZone = null; // null = ausgewählt aus der Feldliste; sonst die Zone, aus der ein bereits platziertes Feld zum Verschieben ausgewählt wurde

  var fieldListEl = document.getElementById("field-list");
  var zoneEls = {
    filter: document.getElementById("zone-filter"),
    columns: document.getElementById("zone-columns"),
    rows: document.getElementById("zone-rows"),
    values: document.getElementById("zone-values")
  };

  function fieldInZone(zoneKey, fieldName) {
    if (zoneKey === "values") return zones.values.some(function (v) { return v.field === fieldName; });
    return zones[zoneKey].indexOf(fieldName) !== -1;
  }

  // Reine Zustandsänderungen ohne Re-Render, damit ein Verschieben (Entfernen +
  // Hinzufügen) als ein einziger Render-Durchlauf passiert statt zwei.
  function addToZoneState(zoneKey, fieldName) {
    if (fieldInZone(zoneKey, fieldName)) return;
    if (zoneKey === "values") {
      zones.values.push({ field: fieldName, agg: defaultAgg(fieldName) });
    } else {
      zones[zoneKey].push(fieldName);
    }
  }

  function removeFromZoneState(zoneKey, fieldName) {
    if (zoneKey === "values") {
      zones.values = zones.values.filter(function (v) { return v.field !== fieldName; });
    } else {
      zones[zoneKey] = zones[zoneKey].filter(function (f) { return f !== fieldName; });
    }
  }

  function addFieldToZone(zoneKey, fieldName) {
    addToZoneState(zoneKey, fieldName);
    renderAll();
  }

  function removeFieldFromZone(zoneKey, fieldName) {
    removeFromZoneState(zoneKey, fieldName);
    renderAll();
  }

  // Verschiebt ein bereits platziertes Feld von einer Zone in eine andere
  // (per Drag & Drop oder per Klick-Auswahl + Klick auf die Zielzone).
  // fromZone ist null, wenn das Feld frisch aus der Feldliste kommt.
  function moveFieldToZone(fieldName, fromZone, toZone) {
    if (fromZone === toZone) return;
    if (fromZone) removeFromZoneState(fromZone, fieldName);
    addToZoneState(toZone, fieldName);
    renderAll();
  }

  function setAgg(fieldName, agg) {
    var entry = zones.values.find(function (v) { return v.field === fieldName; });
    if (!entry) return;
    entry.agg = agg;
    renderPivot();
  }

  // ---------- Rendering: Aufgabentext ----------
  function renderExerciseText() {
    document.getElementById("task-title").textContent = "Aufgabe: " + currentExercise.title;
    document.getElementById("task-intro").innerHTML = currentExercise.intro;
    document.getElementById("hints-list").innerHTML = currentExercise.hints.map(function (h) {
      return "<li>" + h + "</li>";
    }).join("");
  }

  // ---------- Rendering: Feldliste (Excel-Feldliste: Checkbox-artige Zeilen, kein Chip-Look) ----------
  function renderFieldList() {
    var html = "";
    Object.keys(FIELDS).forEach(function (name) {
      // Nur markieren, wenn die Auswahl auch wirklich aus der Feldliste stammt —
      // ein zum Verschieben ausgewähltes Feld aus einer Zone zeigt seine
      // Markierung stattdessen dort (siehe renderZone).
      var sel = (selectedField === name && selectedFieldZone === null) ? " selected" : "";
      html += '<div class="field-row' + sel + '" draggable="true" data-field="' + name + '">' +
        '<span class="field-icon">' + FIELDS[name].icon + "</span><span>" + name + "</span></div>";
    });
    fieldListEl.innerHTML = html;

    fieldListEl.querySelectorAll(".field-row").forEach(function (row) {
      row.addEventListener("dragstart", function (e) {
        e.dataTransfer.setData("text/plain", row.dataset.field);
        row.classList.add("dragging");
      });
      row.addEventListener("dragend", function () { row.classList.remove("dragging"); });
      row.addEventListener("click", function () {
        if (selectedField === row.dataset.field && selectedFieldZone === null) {
          selectedField = null;
        } else {
          selectedField = row.dataset.field;
          selectedFieldZone = null;
        }
        renderFieldList();
        renderZones(); // löscht ggf. die Markierung eines zuvor zum Verschieben ausgewählten Zonen-Chips
      });
    });
  }

  // ---------- Rendering: Drop-Zonen ----------
  function renderZone(zoneKey) {
    var el = zoneEls[zoneKey];
    var entries = zoneKey === "values" ? zones.values : zones[zoneKey].map(function (f) { return { field: f }; });

    if (entries.length === 0) {
      el.innerHTML = '<span class="zone-placeholder">Felder hierher ziehen</span>';
      return;
    }

    var showDateGroups = zoneKey === "rows" || zoneKey === "columns";

    var html = "";
    entries.forEach(function (entry) {
      var fieldName = entry.field;
      var aggControl = "";
      if (zoneKey === "values") {
        var options = aggOptionsFor(fieldName).map(function (opt) {
          var sel = opt === entry.agg ? " selected" : "";
          return '<option value="' + opt + '"' + sel + ">" + opt + "</option>";
        }).join("");
        aggControl = '<select class="agg-select" data-field="' + fieldName + '">' + options + "</select>";
      }

      var isDateField = showDateGroups && FIELDS[fieldName].type === "date";
      var pillsHtml = "";
      if (isDateField) {
        var chosen = dateGroupLevels[fieldName] || DEFAULT_DATE_LEVELS;
        pillsHtml = '<div class="dategroup-pills" data-field="' + fieldName + '">' +
          DATE_LEVELS.map(function (lvl) {
            var active = chosen.indexOf(lvl) !== -1;
            return '<button type="button" class="pill' + (active ? " active" : "") + '" data-level="' + lvl + '">' + DATE_LEVEL_LABELS[lvl] + "</button>";
          }).join("") + "</div>";
      }

      // Icon + Feldname + Entfernen-Button bilden die Kopfzeile. Steuerelemente,
      // die selbst schon breit sein können (Aggregations-Dropdown, Datums-
      // Stufen-Pills), stehen bei "multiline"-Chips auf einer eigenen Zeile
      // darunter statt daneben — sonst konkurrieren sie im schmalen Feldbereich
      // um Platz und laufen seitlich über den Kartenrand hinaus.
      var head = '<span class="field-icon">' + FIELDS[fieldName].icon + "</span>" +
        '<span class="chip-text">' + fieldName + "</span>" +
        '<button class="chip-remove" type="button" aria-label="Entfernen">×</button>';

      // Ein bereits platziertes Feld ist selbst wieder draggable (data-zone
      // verrät beim Drop in eine andere Zone, woher es kommt, siehe unten) und
      // per Klick auswählbar, um es per Klick auf eine andere Zone zu verschieben.
      var isSelectedForMove = selectedField === fieldName && selectedFieldZone === zoneKey;
      var selCls = isSelectedForMove ? " selected" : "";

      var needsMultiline = isDateField || zoneKey === "values";
      if (needsMultiline) {
        html += '<div class="chip zone-chip zone-chip--multiline' + selCls + '" draggable="true" data-field="' + fieldName + '" data-zone="' + zoneKey + '">' +
          '<div class="zone-chip__head">' + head + "</div>" + pillsHtml + aggControl + "</div>";
      } else {
        html += '<span class="chip zone-chip' + selCls + '" draggable="true" data-field="' + fieldName + '" data-zone="' + zoneKey + '">' + head + "</span>";
      }
    });
    el.innerHTML = html;

    el.querySelectorAll(".chip-remove").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var chip = btn.closest(".zone-chip");
        removeFieldFromZone(chip.dataset.zone, chip.dataset.field);
      });
    });

    el.querySelectorAll(".zone-chip").forEach(function (chip) {
      chip.addEventListener("dragstart", function (e) {
        e.dataTransfer.setData("text/plain", chip.dataset.field);
        e.dataTransfer.setData("application/x-source-zone", chip.dataset.zone);
        chip.classList.add("dragging");
      });
      chip.addEventListener("dragend", function () { chip.classList.remove("dragging"); });
      chip.addEventListener("click", function (e) {
        // Klicks auf Entfernen-Button, Aggregations-Dropdown oder Datums-Pills
        // werden von deren eigenen Handlern behandelt (stopPropagation) bzw.
        // sollen hier keine Verschiebe-Auswahl auslösen.
        if (e.target.closest(".chip-remove") || e.target.closest(".agg-select") || e.target.closest(".dategroup-pills")) return;
        var fieldName = chip.dataset.field;
        var zone = chip.dataset.zone;
        if (selectedField === fieldName && selectedFieldZone === zone) {
          selectedField = null;
          selectedFieldZone = null;
        } else {
          selectedField = fieldName;
          selectedFieldZone = zone;
        }
        renderFieldList();
        renderZones();
      });
    });

    if (zoneKey === "values") {
      el.querySelectorAll(".agg-select").forEach(function (select) {
        select.addEventListener("click", function (e) { e.stopPropagation(); });
        select.addEventListener("change", function () {
          setAgg(select.dataset.field, select.value);
        });
      });
    }

    if (showDateGroups) {
      el.querySelectorAll(".dategroup-pills .pill").forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          var fieldName = btn.closest(".dategroup-pills").dataset.field;
          var current = dateGroupLevels[fieldName] || DEFAULT_DATE_LEVELS.slice();
          var lvl = btn.dataset.level;
          var idx = current.indexOf(lvl);
          if (idx !== -1) {
            if (current.length === 1) return; // mindestens eine Stufe muss aktiv bleiben
            dateGroupLevels[fieldName] = current.filter(function (l) { return l !== lvl; });
          } else {
            dateGroupLevels[fieldName] = current.concat([lvl]);
          }
          renderZones();
          renderPivot();
        });
      });
    }
  }

  function renderZones() {
    Object.keys(zoneEls).forEach(renderZone);
  }

  // ---------- Drag & Drop + Klick-Fallback auf Zonen ----------
  Object.keys(zoneEls).forEach(function (zoneKey) {
    var dropEl = zoneEls[zoneKey].closest(".dropzone");

    dropEl.addEventListener("dragover", function (e) {
      e.preventDefault();
      dropEl.classList.add("dragover");
    });
    dropEl.addEventListener("dragleave", function () { dropEl.classList.remove("dragover"); });
    dropEl.addEventListener("drop", function (e) {
      e.preventDefault();
      dropEl.classList.remove("dragover");
      var fieldName = e.dataTransfer.getData("text/plain");
      if (!fieldName || !FIELDS[fieldName]) return;
      // Kommt der Drag von einem bereits platzierten Zonen-Chip (statt aus der
      // Feldliste), steht hier die Ursprungszone drin — das Feld wird dann
      // verschoben statt dupliziert.
      var sourceZone = e.dataTransfer.getData("application/x-source-zone") || null;
      moveFieldToZone(fieldName, sourceZone, zoneKey);
    });

    dropEl.addEventListener("click", function (e) {
      if (e.target.closest(".zone-chip")) return; // handled separately
      if (selectedField) {
        moveFieldToZone(selectedField, selectedFieldZone, zoneKey);
        selectedField = null;
        selectedFieldZone = null;
        renderFieldList();
      }
    });
  });

  // ---------- Pivot-Berechnung ----------
  // Löst ein Feld für eine Datenzeile zu einem {sort, label}-Paar auf: bei
  // Nicht-Datumsfeldern einfach der Rohwert, bei Datumsfeldern die gewählte(n)
  // Gruppierungsstufe(n) (Jahr/Quartal/Monat/Tag). "sort" ist maschinell
  // vergleichbar (chronologisch korrekt, unabhängig von Textformatierung),
  // "label" ist die Anzeige im Pivot.
  function dateLevelValue(date, level) {
    var year = date.getUTCFullYear(), month = date.getUTCMonth(), day = date.getUTCDate();
    if (level === "jahr") return { sort: String(year).padStart(4, "0"), label: String(year) };
    if (level === "quartal") { var q = Math.floor(month / 3) + 1; return { sort: "Q" + q, label: "Q" + q }; }
    if (level === "monat") return { sort: String(month + 1).padStart(2, "0"), label: MONTH_NAMES[month] };
    return { sort: String(day).padStart(2, "0"), label: String(day).padStart(2, "0") + "." }; // "tag"
  }

  function fieldValue(fieldName, row, levelsMap) {
    if (FIELDS[fieldName].type !== "date") {
      var v = String(row[fieldName]);
      return { sort: v, label: v };
    }
    var chosen = (levelsMap && levelsMap[fieldName] && levelsMap[fieldName].length) ? levelsMap[fieldName] : DEFAULT_DATE_LEVELS;
    var ordered = DATE_LEVELS.filter(function (l) { return chosen.indexOf(l) !== -1; });
    if (!ordered.length) ordered = DEFAULT_DATE_LEVELS;
    var parts = ordered.map(function (l) { return dateLevelValue(row[fieldName], l); });
    return {
      sort: parts.map(function (p) { return p.sort; }).join("-"),
      label: parts.map(function (p) { return p.label; }).join(" ")
    };
  }

  // Eindeutige Gruppierungs-Kombinationen für ein Set von Feldern, chronologisch
  // bzw. alphabetisch (de) sortiert je nach Feldtyp.
  function computeGroupCombos(fields, data, levelsMap) {
    if (fields.length === 0) return [{ key: "", label: "Gesamt", sortParts: [], parts: [] }];
    var map = new Map();
    data.forEach(function (row) {
      var vals = fields.map(function (f) { return fieldValue(f, row, levelsMap); });
      var key = vals.map(function (v) { return v.sort; }).join(" | ");
      if (!map.has(key)) {
        map.set(key, {
          key: key,
          label: vals.map(function (v) { return v.label; }).join(" / "),
          sortParts: vals.map(function (v) { return v.sort; }),
          // Feld+Anzeigewert je Gruppierungsfeld, unabhängig von Zeilen/Spalten-Zuordnung —
          // wird für die GETPIVOTDATA-artige Formel in der Formelleiste gebraucht.
          parts: fields.map(function (f, idx) { return { field: f, label: vals[idx].label }; })
        });
      }
    });
    var combos = Array.from(map.values());
    combos.sort(function (a, b) {
      for (var i = 0; i < a.sortParts.length; i++) {
        var isDate = FIELDS[fields[i]].type === "date";
        var cmp = isDate
          ? (a.sortParts[i] < b.sortParts[i] ? -1 : a.sortParts[i] > b.sortParts[i] ? 1 : 0)
          : a.sortParts[i].localeCompare(b.sortParts[i], "de");
        if (cmp) return cmp;
      }
      return 0;
    });
    return combos;
  }

  function rowMatchesCombo(row, fields, combo, levelsMap) {
    if (fields.length === 0) return true;
    return fields.map(function (f) { return fieldValue(f, row, levelsMap).sort; }).join(" | ") === combo.key;
  }

  function fieldAxisLabel(fieldName, levelsMap) {
    if (FIELDS[fieldName].type !== "date") return fieldName;
    var chosen = (levelsMap && levelsMap[fieldName] && levelsMap[fieldName].length) ? levelsMap[fieldName] : DEFAULT_DATE_LEVELS;
    var ordered = DATE_LEVELS.filter(function (l) { return chosen.indexOf(l) !== -1; });
    return fieldName + " (" + ordered.map(function (l) { return DATE_LEVEL_LABELS[l]; }).join("/") + ")";
  }

  var AGG_FUNC_NAME = { Summe: "SUMME", Anzahl: "ANZAHL", Mittelwert: "MITTELWERT", Min: "MIN", Max: "MAX" };

  // Formel für eine Zelle in der Gesamt-Zeile: die entspricht tatsächlich der
  // im Raster sichtbaren Summe/Anzahl/... der Datenzeilen in derselben Spalte.
  function totalColumnFormula(agg, colLetter, firstRow, lastRow) {
    return "=" + AGG_FUNC_NAME[agg] + "(" + colLetter + firstRow + ":" + colLetter + lastRow + ")";
  }

  // Formel für eine normale Pivot-Datenzelle: eine PivotTable liefert selbst
  // keine sichtbare Formel (nur den berechneten Wert), aber genau dafür gibt
  // es GETPIVOTDATA — die Formel, die Excel einfügt, wenn man von außen auf
  // eine Pivot-Zelle verweist. Didaktisch die treffendste Darstellung dessen,
  // "was diese Zelle bedeutet".
  function pivotDataFormula(fieldName, filterParts, anchorCell) {
    var s = '=GETPIVOTDATA("' + fieldName + '";' + anchorCell;
    filterParts.forEach(function (p) { s += ';"' + p.field + '";"' + p.label + '"'; });
    return s + ")";
  }

  function escapeAttr(s) {
    return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
  }

  // Aktive Zelle: Namensfeld + Formel aktualisieren. Persistenter Klick-Handler
  // (einmalig gebunden, siehe unten) statt pro Render neu angehängt, da
  // #sheet-canvas als Element selbst bei jedem Render erhalten bleibt.
  function activateCell(cell) {
    var prevActive = document.querySelector(".sheet-cell--active");
    if (prevActive) prevActive.classList.remove("sheet-cell--active");
    cell.classList.add("sheet-cell--active");
    document.getElementById("formula-namebox").textContent = cell.dataset.addr;
    document.getElementById("formula-text").textContent = cell.dataset.formula;
  }

  // Leerer-Bericht-Grafik wie in echtem Excel: Tabellen- und Feldlisten-Symbol
  // mit Kontrollkästchen-Lupe. Erscheint nur, bevor überhaupt ein Feld abgelegt
  // wurde (echtes Excel zeigt exakt diese Grafik in genau diesem Zustand).
  var EMPTY_PIVOT_ART_SVG =
    '<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">' +
    '<rect x="2" y="10" width="70" height="70" fill="#fff" stroke="#AAB9DE"/>' +
    '<rect x="2" y="10" width="70" height="13" fill="#4472C4"/>' +
    '<rect x="2" y="10" width="17" height="13" fill="#B4C6E7"/>' +
    '<rect x="19" y="10" width="17" height="13" fill="#4472C4"/>' +
    '<rect x="36" y="10" width="17" height="13" fill="#B4C6E7"/>' +
    '<rect x="53" y="10" width="19" height="13" fill="#4472C4"/>' +
    '<g stroke="#D9D9D9">' +
    '<line x1="2" y1="37" x2="72" y2="37"/><line x1="2" y1="50" x2="72" y2="50"/><line x1="2" y1="63" x2="72" y2="63"/>' +
    '<line x1="19" y1="23" x2="19" y2="80"/><line x1="36" y1="23" x2="36" y2="80"/><line x1="53" y1="23" x2="53" y2="80"/>' +
    "</g>" +
    '<rect x="110" y="4" width="88" height="92" fill="#fff" stroke="#AAB9DE"/>' +
    '<rect x="110" y="4" width="88" height="12" fill="#4472C4"/>' +
    '<g fill="#D9D9D9">' +
    '<rect x="117" y="24" width="60" height="5"/><rect x="117" y="34" width="60" height="5"/><rect x="117" y="44" width="45" height="5"/>' +
    "</g>" +
    '<g fill="none" stroke="#AAB9DE">' +
    '<rect x="117" y="58" width="34" height="13"/><rect x="155" y="58" width="34" height="13"/>' +
    '<rect x="117" y="75" width="34" height="13"/><rect x="155" y="75" width="34" height="13"/>' +
    "</g>" +
    '<circle cx="90" cy="52" r="23" fill="#fff" stroke="#D9D9D9"/>' +
    '<rect x="79" y="35" width="11" height="11" fill="none" stroke="#A6A6A6"/>' +
    '<rect x="79" y="48" width="11" height="11" fill="none" stroke="#C00000" stroke-width="1.3"/>' +
    '<path d="M81 54 L84.5 57.5 L89 51" fill="none" stroke="#C00000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<rect x="79" y="61" width="11" height="11" fill="none" stroke="#A6A6A6"/>' +
    "</svg>";

  // Die im HTML-String vergebenen "top"-Werte für fixierte Zeilen beruhen auf
  // einer angenommenen Zeilenhöhe (ROW_H) — Schriftgrößen/Innenabstände weichen
  // davon aber leicht ab, je nachdem wie viele fixierte Zeilen (Kopfzeile(n),
  // ggf. Filterzeilen) übereinander gestapelt werden. Nach dem Rendern anhand
  // der tatsächlich gemessenen Höhen korrigieren, statt die Konstante ewig
  // nachzujustieren — bleibt so auch bei künftigen Stil-Anpassungen korrekt.
  function fixStickyOffsets(canvas) {
    var colheadsRow = canvas.querySelector(".sheet-colheads");
    var offset = colheadsRow ? colheadsRow.getBoundingClientRect().height : 0;
    canvas.querySelectorAll(".sheet-header-row").forEach(function (tr) {
      var h = tr.getBoundingClientRect().height;
      Array.prototype.forEach.call(tr.children, function (cell) { cell.style.top = offset + "px"; });
      offset += h;
    });
  }

  function positionEmptyOverlay(canvas) {
    var anchor = canvas.querySelector(".pivot-anchor-cell");
    var overlay = document.getElementById("pivot-empty-overlay");
    if (anchor && overlay) {
      overlay.style.left = anchor.offsetLeft + "px";
      overlay.style.top = anchor.offsetTop + "px";
    }
  }

  function emptyPivotOverlayHtml() {
    return '<div class="pivot-empty-overlay" id="pivot-empty-overlay">' +
      '<div class="pivot-empty-overlay__namebox">PivotTable1</div>' +
      '<p class="pivot-empty-overlay__text">Wählen Sie zum Erstellen eines Berichts die Felder aus der PivotTable-Feldliste aus.</p>' +
      '<div class="pivot-empty-overlay__art">' + EMPTY_PIVOT_ART_SVG + "</div>" +
      "</div>";
  }

  function renderPivot() {
    var canvas = document.getElementById("sheet-canvas");
    var rowFields = zones.rows;
    var colFields = zones.columns;
    var valueFields = zones.values;
    var pivotRows, pivotColCount;
    var showEmptyOverlay = false;

    if (rowFields.length === 0 && colFields.length === 0) {
      // Komplett leeres Blatt: zunächst nur eine Ankerzelle — wie viele weitere
      // leere Spalten dahinter nötig sind, um den sichtbaren Platz bis zum
      // Feldbereich zu füllen, wird nach dem ersten Render gemessen und ergänzt
      // (siehe unten), statt eine feste Anzahl zu erraten.
      pivotColCount = 1;
      var blankRow = [];
      for (var bc = 0; bc < pivotColCount; bc++) {
        blankRow.push(bc === 0 ? { html: "", cls: "pivot-anchor-cell" } : { html: "" });
      }
      // Bewusst bei Index 1 (Arbeitsblatt-Zeile 2) statt 0: Zeile 1 fällt sonst mit
      // der fixierten, grau hinterlegten Kopfzeile der Quelldaten zusammen — die
      // Ankerzelle (und damit "PivotTable1" darüber) würde dahinter verschwinden.
      pivotRows = [];
      pivotRows[1] = blankRow;
      showEmptyOverlay = true;
    } else {
      var data = DATA;
      var hasValues = valueFields.length > 0;
      var filterFields = zones.filter;

      var rowCombos = computeGroupCombos(rowFields, data, dateGroupLevels);
      var colCombos = computeGroupCombos(colFields, data, dateGroupLevels);

      pivotRows = [];

      // Filter-Bereich: eine Zeile "Feldname | (Alle)" je Filterfeld, plus eine
      // Leerzeile als Abstand — genau wie in echtem Excel. Alles darunter
      // (Kopf-/Datenzeilen) rückt dafür entsprechend nach unten.
      filterFields.forEach(function (ff) {
        var frow = [{ header: true, cls: "rowlabel", html: ff }, { header: true, html: "(Alle)" }];
        frow.sticky = true;
        pivotRows.push(frow);
      });
      if (filterFields.length) pivotRows.push([]);
      var rowOffset = filterFields.length ? filterFields.length + 1 : 0;

      if (hasValues) {
        // Physische Spalten der Pivot-Ausgabe (ohne die Zeilenbeschriftungs-
        // Spalte) in exakt der Reihenfolge, in der sie in jeder Datenzeile
        // erscheinen — legt fest, welcher Spaltenbuchstabe (ab PIVOT_COL_OFFSET,
        // da Quelldaten + Lückenspalte davor liegen) zu welcher Kombination/
        // welchem Wertefeld gehört.
        var columnMeta = [];
        colCombos.forEach(function (cc) {
          valueFields.forEach(function (vf) { columnMeta.push({ combo: cc, vf: vf }); });
        });
        if (colFields.length) {
          valueFields.forEach(function (vf) { columnMeta.push({ combo: null, vf: vf }); }); // Gesamt-Spalte
        }

        var firstDataRow = rowOffset + 3; // + die beiden Kopfzeilen
        var lastDataRow = rowOffset + 2 + rowCombos.length;
        var totalRowNum = lastDataRow + 1;
        var anchorCell = "$" + columnLetter(1 + PIVOT_COL_OFFSET) + "$" + firstDataRow;

        // Kopfzeile 1: Spaltenkombination je Wertefeld-Gruppe
        // (pivot-header-row je Zelle statt pro Zeile vergeben — die Zeile
        // enthält über den Merge auch die Quelldaten-Spalten A–D, die ihr
        // neutrales Grau behalten sollen, nicht das Blau der Pivot-Kopfzeile.)
        var headerRow1 = [{ header: true, cls: "rowlabel pivot-header-row", html: rowFields.length ? rowFields.map(function (f) { return fieldAxisLabel(f, dateGroupLevels); }).join(" / ") : "" }];
        colCombos.forEach(function (cc) {
          headerRow1.push({ header: true, colspan: valueFields.length, cls: "pivot-header-row", html: cc.label });
        });
        if (colFields.length) headerRow1.push({ header: true, colspan: valueFields.length, cls: "pivot-header-row", html: "Gesamt" });
        headerRow1.sticky = true;
        pivotRows.push(headerRow1);

        // Kopfzeile 2: Wertefeld/Aggregation je Spalte
        var headerRow2 = [{ header: true, cls: "rowlabel pivot-header-row", html: "" }];
        columnMeta.forEach(function (cm) {
          headerRow2.push({ header: true, cls: "pivot-header-row", html: cm.vf.agg + " von " + cm.vf.field });
        });
        headerRow2.sticky = true;
        pivotRows.push(headerRow2);

        // Datenzeilen
        rowCombos.forEach(function (rc, rIdx) {
          var worksheetRow = firstDataRow + rIdx;
          var rowMatched = data.filter(function (d) { return rowMatchesCombo(d, rowFields, rc, dateGroupLevels); });
          var dataRow = [{ cls: "rowlabel", html: rc.label }];
          columnMeta.forEach(function (cm, cIdx) {
            var colLetter = columnLetter(cIdx + 2 + PIVOT_COL_OFFSET);
            var cellData = cm.combo ? rowMatched.filter(function (d) { return rowMatchesCombo(d, colFields, cm.combo, dateGroupLevels); }) : rowMatched;
            var val = aggregate(cm.vf.agg, cellData.map(function (d) { return d[cm.vf.field]; }));
            var filterParts = rc.parts.concat(cm.combo ? cm.combo.parts : []);
            var formula = pivotDataFormula(cm.vf.field, filterParts, anchorCell);
            dataRow.push({
              html: formatAggResult(cm.vf.agg, cm.vf.field, val),
              cls: "sheet-cell--value",
              attrs: ' data-addr="' + colLetter + worksheetRow + '" data-formula="' + escapeAttr(formula) + '"'
            });
          });
          pivotRows.push(dataRow);
        });

        // Gesamtsumme-Zeile
        var totalRow = [{ cls: "rowlabel cell-total", html: "Gesamt" }];
        columnMeta.forEach(function (cm, cIdx) {
          var colLetter = columnLetter(cIdx + 2 + PIVOT_COL_OFFSET);
          var colMatched = cm.combo ? data.filter(function (d) { return rowMatchesCombo(d, colFields, cm.combo, dateGroupLevels); }) : data;
          var val = aggregate(cm.vf.agg, colMatched.map(function (d) { return d[cm.vf.field]; }));
          var formula = totalColumnFormula(cm.vf.agg, colLetter, firstDataRow, lastDataRow);
          totalRow.push({
            html: formatAggResult(cm.vf.agg, cm.vf.field, val),
            cls: "sheet-cell--value cell-total",
            attrs: ' data-addr="' + colLetter + totalRowNum + '" data-formula="' + escapeAttr(formula) + '"'
          });
        });
        pivotRows.push(totalRow);

        pivotColCount = 1 + columnMeta.length;
      } else {
        // Noch kein Wertefeld: zeige trotzdem sofort die Gruppierungs-
        // Beschriftungen an (Zeilen- und/oder Spaltenwerte) — genau wie es
        // echtes Excel schon tut, bevor überhaupt ein Wertefeld gewählt wurde.
        var skColCombos = colFields.length ? colCombos : [];
        pivotColCount = 1 + skColCombos.length;

        var skHeaderRow = [{ header: true, cls: "rowlabel pivot-header-row", html: rowFields.length ? rowFields.map(function (f) { return fieldAxisLabel(f, dateGroupLevels); }).join(" / ") : "" }];
        skColCombos.forEach(function (cc) { skHeaderRow.push({ header: true, cls: "pivot-header-row", html: cc.label }); });
        skHeaderRow.sticky = true;
        pivotRows.push(skHeaderRow);

        if (rowFields.length) {
          rowCombos.forEach(function (rc) {
            var skRow = [{ cls: "rowlabel", html: rc.label }];
            skColCombos.forEach(function () { skRow.push({ html: "" }); });
            pivotRows.push(skRow);
          });
          var skTotalRow = [{ cls: "rowlabel cell-total", html: "Gesamt" }];
          skColCombos.forEach(function () { skTotalRow.push({ cls: "cell-total", html: "" }); });
          pivotRows.push(skTotalRow);
        }
      }

      pivotColCount = Math.max(pivotColCount, filterFields.length ? 2 : 1);
    }

    var tableModifierClass = showEmptyOverlay ? "sheet-table--uniform-cols" : "";
    canvas.innerHTML = renderSheetTable(mergeIntoSheet(sourceRows, pivotRows, pivotColCount), tableModifierClass) +
      (showEmptyOverlay ? emptyPivotOverlayHtml() : "");
    fixStickyOffsets(canvas);
    document.getElementById("sheet-caption").textContent =
      "Spalten A–" + columnLetter(SOURCE_COL_COUNT) + ": Quelldaten (" + DATA.length + " Zeilen, 2026) · ab Spalte " + columnLetter(1 + PIVOT_COL_OFFSET) + ": deine Pivot-Tabelle";

    if (showEmptyOverlay) {
      positionEmptyOverlay(canvas);

      // Ein echtes Arbeitsblatt hört nicht bei einer festen Spaltenanzahl auf,
      // sondern läuft mit Gitternetzlinien bis zum sichtbaren Rand weiter.
      // Nach dem ersten Render (nur die Ankerspalte) messen, wie viel Platz bis
      // zum Feldbereich noch frei ist, und mit genau so vielen weiteren leeren
      // Spalten auffüllen — das passt sich automatisch an jede Fenstergröße an,
      // statt eine feste Anzahl zu hartcodieren.
      var table = canvas.querySelector("table.sheet-table");
      var anchorForWidth = canvas.querySelector(".pivot-anchor-cell");
      if (table && anchorForWidth) {
        var missingWidth = canvas.clientWidth - table.offsetWidth;
        var colWidth = anchorForWidth.offsetWidth || 92;
        if (missingWidth > colWidth) {
          var extraCols = Math.ceil(missingWidth / colWidth);
          pivotColCount += extraCols;
          var lastRow = pivotRows[pivotRows.length - 1];
          for (var ec = 0; ec < extraCols; ec++) lastRow.push({ html: "" });
          canvas.innerHTML = renderSheetTable(mergeIntoSheet(sourceRows, pivotRows, pivotColCount), tableModifierClass) + emptyPivotOverlayHtml();
          fixStickyOffsets(canvas);
          positionEmptyOverlay(canvas);
        }
      }
    }

    // Aktive Zelle: standardmäßig die Gesamtsumme unten rechts — didaktisch
    // der interessanteste Fall. Klick auf eine andere Datenzelle (siehe
    // persistenter Handler unten) aktualisiert Namensfeld und Formel.
    var valueCells = canvas.querySelectorAll(".sheet-cell--value");
    if (valueCells.length) {
      activateCell(valueCells[valueCells.length - 1]);
    } else {
      document.getElementById("formula-namebox").textContent = "";
      document.getElementById("formula-text").textContent = "";
    }
  }

  document.getElementById("sheet-canvas").addEventListener("click", function (e) {
    var cell = e.target.closest(".sheet-cell--value");
    if (cell) activateCell(cell);
  });

  function renderAll() {
    renderZones();
    renderPivot();
  }

  // ---------- Prüfen ----------
  // Statt starr zu prüfen, ob Felder in exakt der hinterlegten Zone liegen,
  // wird das vom Nutzer tatsächlich erzeugte Pivot-Ergebnis (Gruppierung +
  // Aggregation) berechnet und mit einer genauso berechneten Musterlösung
  // verglichen. Das akzeptiert automatisch jede inhaltlich gleichwertige
  // Lösung (z.B. Gruppierungsfeld in Spalten statt Zeilen, wenn
  // rowsColsInterchangeable gesetzt ist) und deckt gleichzeitig eine falsche
  // Aggregation ab, weil die berechneten Werte dann nicht mehr übereinstimmen.
  var feedbackEl = document.getElementById("feedback");

  function sameSet(a, b) {
    var as = a.slice().sort(), bs = b.slice().sort();
    return as.length === bs.length && as.every(function (v, i) { return v === bs[i]; });
  }

  function computeFlatResultSet(groupFields, valueFields, data, levelsMap) {
    var combos = computeGroupCombos(groupFields, data, levelsMap);
    return combos.map(function (combo) {
      var matched = groupFields.length ? data.filter(function (d) { return rowMatchesCombo(d, groupFields, combo, levelsMap); }) : data;
      var values = {};
      valueFields.forEach(function (vf) {
        values[vf.agg + ":" + vf.field] = aggregate(vf.agg, matched.map(function (d) { return d[vf.field]; }));
      });
      return { key: combo.key, values: values };
    });
  }

  function resultSetsEqual(a, b) {
    if (a.length !== b.length) return { equal: false, reason: "count" };
    for (var i = 0; i < a.length; i++) {
      if (a[i].key !== b[i].key) return { equal: false, reason: "count" };
      var ak = Object.keys(a[i].values), bk = Object.keys(b[i].values);
      if (ak.length !== bk.length) return { equal: false, reason: "values" };
      for (var j = 0; j < ak.length; j++) {
        var k = ak[j];
        if (!(k in b[i].values) || Math.abs(a[i].values[k] - b[i].values[k]) > 0.01) {
          return { equal: false, reason: "values" };
        }
      }
    }
    return { equal: true };
  }

  function checkSolution() {
    var sol = currentExercise.solution;

    if (zones.values.length === 0) {
      return { correct: false, messages: ["Es fehlt noch ein Feld im Bereich „Werte“."] };
    }
    if (zones.rows.length === 0 && zones.columns.length === 0) {
      return { correct: false, messages: ["Ziehe mindestens ein Gruppierungsfeld in „Zeilen“ oder „Spalten“."] };
    }

    if (!sol.rowsColsInterchangeable) {
      var rowsOk = sameSet(zones.rows, sol.rows);
      var columnsOk = sameSet(zones.columns, sol.columns);
      if (!rowsOk || !columnsOk) {
        return { correct: false, messages: ["Bei dieser Aufgabe ist wichtig, welches Feld in „Zeilen“ und welches in „Spalten“ liegt — prüfe die Zuordnung."] };
      }
    }

    if (!sameSet(zones.filter, sol.filter)) {
      return { correct: false, messages: ["Der Bereich „Filter“ passt noch nicht (evtl. wird er für diese Aufgabe gar nicht gebraucht)."] };
    }

    var studentFields = zones.rows.concat(zones.columns);
    var targetFields = sol.rows.concat(sol.columns);
    var studentResult = computeFlatResultSet(studentFields, zones.values, DATA, dateGroupLevels);
    var targetResult = computeFlatResultSet(targetFields, sol.values, DATA, sol.dateGroupLevels || {});
    var comparison = resultSetsEqual(studentResult, targetResult);

    if (!comparison.equal) {
      if (comparison.reason === "count") {
        var hasDateField = studentFields.some(function (f) { return FIELDS[f].type === "date"; });
        var hint = hasDateField
          ? " Prüfe, welche Felder du zur Gruppierung genutzt hast bzw. welche Gruppierungsstufe (Jahr/Quartal/Monat/Tag) beim Datumsfeld eingestellt ist."
          : " Prüfe, welche Felder du zur Gruppierung genutzt hast.";
        return { correct: false, messages: ["Deine Gruppierung ergibt eine andere Anzahl an Gruppen als erwartet (" + studentResult.length + " statt " + targetResult.length + ")." + hint] };
      }
      return { correct: false, messages: ["Die berechneten Werte stimmen noch nicht mit der Musterlösung überein. Prüfe Feld <em>und</em> Aggregation im Bereich „Werte“."] };
    }

    return { correct: true, messages: ["Richtig! 🎉 Deine Pivot-Tabelle liefert genau das erwartete Ergebnis."] };
  }

  document.getElementById("btn-check").addEventListener("click", function () {
    var result = checkSolution();

    feedbackEl.classList.remove("correct", "incorrect");
    feedbackEl.classList.add("show", result.correct ? "correct" : "incorrect");

    if (result.correct) {
      feedbackEl.innerHTML = result.messages[0];
    } else {
      feedbackEl.innerHTML = "Noch nicht ganz:<ul><li>" + result.messages.join("</li><li>") + "</li></ul>";
    }
  });

  document.getElementById("btn-reset").addEventListener("click", function () {
    zones = { filter: [], columns: [], rows: [], values: [] };
    dateGroupLevels = {};
    selectedField = null;
    selectedFieldZone = null;
    feedbackEl.classList.remove("show", "correct", "incorrect");
    renderFieldList();
    renderAll();
  });

  document.getElementById("hints-toggle").addEventListener("click", function () {
    var box = document.getElementById("hints-box");
    var open = box.classList.toggle("open");
    this.textContent = open ? "Tipps ausblenden" : "Tipps anzeigen";
  });

  renderExerciseText();
  renderFieldList();
  renderAll();
})();
</script>
</body>
</html>
